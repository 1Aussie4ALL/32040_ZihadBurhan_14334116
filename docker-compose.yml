services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careprior}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careprior}
      POSTGRES_DB: ${POSTGRES_DB:-careprior}
    ports:
      - "5432:5432"
    volumes:
      - careprior_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careprior}"]
      interval: 5s
      timeout: 5s
      retries: 10

  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-careprior}:${POSTGRES_PASSWORD:-careprior}@postgres:5432/${POSTGRES_DB:-careprior}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  rule-engine:
    build:
      context: .
      dockerfile: services/rule-engine/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-careprior}:${POSTGRES_PASSWORD:-careprior}@postgres:5432/${POSTGRES_DB:-careprior}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
    ports:
      - "8003:8000"

  prioritisation-service:
    build:
      context: .
      dockerfile: services/prioritisation-service/Dockerfile
    environment:
      RULE_ENGINE_URL: http://rule-engine:8000
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
    ports:
      - "8004:8000"
    depends_on:
      - rule-engine
      - ai-service

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-careprior}:${POSTGRES_PASSWORD:-careprior}@postgres:5432/${POSTGRES_DB:-careprior}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
    ports:
      - "8005:8000"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-careprior}:${POSTGRES_PASSWORD:-careprior}@postgres:5432/${POSTGRES_DB:-careprior}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      AUDIT_SERVICE_URL: http://audit-service:8000
      RULE_ENGINE_URL: http://rule-engine:8000
      AI_SERVICE_URL: http://ai-service:8000
      PRIORITISATION_SERVICE_URL: http://prioritisation-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_started
      rule-engine:
        condition: service_started
      ai-service:
        condition: service_started
      prioritisation-service:
        condition: service_started
      notification-service:
        condition: service_started

  patient-portal:
    build:
      context: .
      dockerfile: apps/patient-portal/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  staff-dashboard:
    build:
      context: .
      dockerfile: apps/staff-dashboard/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  careprior_postgres_data:
